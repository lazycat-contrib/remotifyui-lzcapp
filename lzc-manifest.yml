application:
  subdomain: remotifyui
  oidc_redirect_path: /api/auth/oidc/callback
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://remotifyui:3000/
  injects:
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  remotifyui:
    # Upstream: ghcr.io/ca-x/remotifyui:0.1.0
    # upstream: ghcr.io/ca-x/remotifyui:v0.1.0
    image: registry.lazycat.cloud/czyt/ca-x/remotifyui:d2adc05ded55a814
    user: root
    binds:
      - /lzcapp/var/data:/data
    environment:
      - REMOTIFYUI_LISTEN=0.0.0.0:3000
      - REMOTIFYUI_DATABASE_URL=sqlite:///data/remotifyui.db?mode=rwc
      - REMOTIFYUI_DATA_DIR=/data
      - REMOTIFYUI_PUBLIC_URL=https://{{ .S.AppDomain }}
      - REMOTIFYUI_BOOTSTRAP_EMAIL={{ .U.bootstrap_email }}
      - REMOTIFYUI_BOOTSTRAP_PASSWORD={{ .U.bootstrap_password }}
      - REMOTIFYUI_TRUSTED_PROXY_CIDRS={{ .U.trusted_proxy_cidrs }}
      - REMOTIFYUI_TRUSTED_PROXY_HEADER={{ .U.trusted_proxy_header }}
      - REMOTIFYUI_OIDC_ISSUER=${LAZYCAT_AUTH_OIDC_ISSUER_URI}
      - REMOTIFYUI_OIDC_CLIENT_ID=${LAZYCAT_AUTH_OIDC_CLIENT_ID}
      - REMOTIFYUI_OIDC_CLIENT_SECRET=${LAZYCAT_AUTH_OIDC_CLIENT_SECRET}
      - REMOTIFYUI_OIDC_SCOPES={{ .U.oidc_scopes }}
      - REMOTIFYUI_DISABLE_LOCAL_LOGIN={{ .U.disable_local_login }}
      - REMOTIFYUI_SESSION_HOURS={{ .U.session_hours }}
      - REMOTIFYUI_MAX_REQUEST_BYTES={{ .U.max_request_bytes }}
      - REMOTIFYUI_MAX_OUTPUT_BYTES={{ .U.max_output_bytes }}
      - REMOTIFYUI_MAX_TRANSFER_BYTES={{ .U.max_transfer_bytes }}
      - REMOTIFYUI_OPERATION_RETENTION_DAYS={{ .U.operation_retention_days }}
      - REMOTIFYUI_AUDIT_RETENTION_DAYS={{ .U.audit_retention_days }}
      - RUST_LOG={{ .U.rust_log }}
usage: "首次启动会创建设置向导中的所有者账号。请先用本地账号登录并在设置中关联懒猫 OIDC；确认至少一个 owner/admin 已关联后，才能重新配置并关闭本地登录。"
